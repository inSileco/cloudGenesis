<div id="login-modal" class="hidden fixed inset-0 z-50 overflow-y-auto bg-[#0f172a]/60 backdrop-blur-sm">
    <div class="relative top-24 mx-auto w-full max-w-md px-4">
        <div class="surface-card p-6">
            <div class="flex justify-between items-center mb-2">
                <div>
                    <div class="kicker">Sign in</div>
                    <h3 class="text-2xl mt-1">Welcome back</h3>
                </div>
                <button id="close-modal" class="text-muted hover:text-brand-500 dark:hover:text-accent" aria-label="Close">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="accent-rule my-3"></div>

            <form id="login-form" class="space-y-4 mt-4">
                <div>
                    <label for="email" class="block text-sm font-medium text-ink-600 dark:text-slate-300 mb-1">Email</label>
                    <input type="email" id="email" name="email" required class="input-field">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-ink-600 dark:text-slate-300 mb-1">Password</label>
                    <input type="password" id="password" name="password" required class="input-field">
                </div>
                <button type="submit" class="btn-primary w-full">Sign in</button>
            </form>

            <div id="login-message" class="hidden mt-4 p-3 rounded-md text-sm"></div>
        </div>
    </div>
</div>

<script>
    // Theme toggle
    (function () {
        function setTheme(theme) {
            if (theme === 'dark') document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
            try { localStorage.setItem('theme', theme); } catch (e) {}
        }
        function toggle() {
            var isDark = document.documentElement.classList.contains('dark');
            setTheme(isDark ? 'light' : 'dark');
        }
        document.getElementById('theme-toggle')?.addEventListener('click', toggle);
        document.getElementById('theme-toggle-mobile')?.addEventListener('click', toggle);
    })();

    function updateNavbar() {
        const userName = localStorage.getItem('userName');
        const loginButton = document.getElementById('login-button');
        const userDisplay = document.getElementById('user-display');
        const logoutButton = document.getElementById('logout-button');

        if (userName) {
            loginButton?.classList.add('hidden');
            if (userDisplay) {
                userDisplay.textContent = userName;
                userDisplay.classList.remove('hidden');
            }
            logoutButton?.classList.remove('hidden');
        } else {
            loginButton?.classList.remove('hidden');
            userDisplay?.classList.add('hidden');
            logoutButton?.classList.add('hidden');
        }
    }

    function logout() {
        localStorage.removeItem('userEmail');
        localStorage.removeItem('userName');
        localStorage.removeItem('userFullName');
        window.location.href = '/';
    }

    updateNavbar();
    document.getElementById('logout-button')?.addEventListener('click', logout);

    document.getElementById('mobile-menu-button')?.addEventListener('click', function () {
        document.getElementById('mobile-menu').classList.toggle('hidden');
    });

    const modal = document.getElementById('login-modal');
    const loginButton = document.getElementById('login-button');
    const loginButtonMobile = document.getElementById('login-button-mobile');
    const closeModal = document.getElementById('close-modal');
    const loginForm = document.getElementById('login-form');
    const loginMessage = document.getElementById('login-message');

    function openModal() { modal.classList.remove('hidden'); }
    function closeModalFunc() {
        modal.classList.add('hidden');
        loginForm.reset();
        loginMessage.classList.add('hidden');
    }

    loginButton?.addEventListener('click', openModal);
    loginButtonMobile?.addEventListener('click', openModal);
    closeModal?.addEventListener('click', closeModalFunc);
    modal?.addEventListener('click', function (e) {
        if (e.target === modal) closeModalFunc();
    });

    loginForm?.addEventListener('submit', function (e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const users = {
            'mhb@fake.io': { password: 'insilecloud', userName: 'mhb', fullName: 'Marie-Helene', userId: 'mhb' },
            'kc@fake.io':  { password: 'insilecloud', userName: 'kc',  fullName: 'Kevin',        userId: 'kc'  },
            'sd@fake.io':  { password: 'insilecloud', userName: 'sd',  fullName: 'Steve',        userId: 'sd'  }
        };

        const user = users[email];
        if (user && password === user.password) {
            localStorage.setItem('userEmail', email);
            localStorage.setItem('userName', user.userName);
            localStorage.setItem('userFullName', user.fullName);
            localStorage.setItem('userId', user.userId);
            window.location.href = `/user/${user.userId}`;
        } else {
            loginMessage.textContent = 'Invalid credentials. Please try again.';
            loginMessage.className = 'mt-4 p-3 rounded-md text-sm bg-red-50 text-red-700 border border-red-100 dark:bg-red-950/40 dark:text-red-300 dark:border-red-900';
            loginMessage.classList.remove('hidden');
            setTimeout(() => loginMessage.classList.add('hidden'), 3000);
        }
    });
</script>
