<div id="login-modal" class="hidden fixed inset-0 z-50 overflow-y-auto bg-[#0f172a]/60 backdrop-blur-sm">
    <div class="relative top-24 mx-auto w-full max-w-md px-4">
        <div class="surface-card p-6">
            <div class="flex justify-between items-center mb-2">
                <div>
                    <div class="kicker">Sign in</div>
                    <h3 class="text-2xl mt-1">Welcome back</h3>
                </div>
                <button id="close-modal" class="text-muted hover:text-brand-500 dark:hover:text-accent" aria-label="Close">

            </div>
            <div class="accent-rule my-3"></div>

            <form id="login-form" class="space-y-4 mt-4">
                <div>
                    <label for="email" class="block text-sm font-medium text-ink-600 dark:text-slate-300 mb-1">Email</label>
                    <input type="email" id="email" name="email" required class="input-field">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-ink-600 dark:text-slate-300 mb-1">Password</label>

                <button type="submit" class="btn-primary w-full">Sign in</button>

        </div>
    </div>

<script>
    // Theme toggle
    (function () {
        function setTheme(theme) {
            if (theme === 'dark') document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
            try { localStorage.setItem('theme', theme); } catch (e) {}
        }
        function toggle() {
            var isDark = document.documentElement.classList.contains('dark');
            setTheme(isDark ? 'light' : 'dark');
        }
        document.getElementById('theme-toggle')?.addEventListener('click', toggle);
        document.getElementById('theme-toggle-mobile')?.addEventListener('click', toggle);
    })();

    function updateNavbar() {
        const userId = localStorage.getItem('userId');
        const userName = localStorage.getItem('userName');
        const userFullName = localStorage.getItem('userFullName');
        const isSysAdmin = localStorage.getItem('isSysAdmin') === 'true';
        const loginButton = document.getElementById('login-button');
        const loginButtonMobileBtn = document.getElementById('login-button-mobile');
        const userMenu = document.getElementById('user-menu');
        const userDisplay = document.getElementById('user-display');
        const userInitials = document.getElementById('user-menu-initials');
        const adminBadge = document.getElementById('user-menu-admin-badge');

        const projectsLink = document.getElementById('menu-projects');
        const projectsLinkMobile = document.getElementById('menu-projects-mobile');
        const settingsLink = document.getElementById('menu-settings');
        const backOfficeLink = document.getElementById('menu-back-office');
        const settingsLinkMobile = document.getElementById('menu-settings-mobile');
        const backOfficeLinkMobile = document.getElementById('menu-back-office-mobile');
        const logoutBtn = document.getElementById('logout-button');
        const logoutBtnMobile = document.getElementById('logout-button-mobile');

        if (userId && userName) {
            loginButton?.classList.add('hidden');
            loginButtonMobileBtn?.classList.add('hidden');
            userMenu?.classList.remove('hidden');
            if (userDisplay) userDisplay.textContent = userName;
            if (userInitials) {
                const source = (userFullName || userName).trim();
                const parts = source.split(/\s+/);
                userInitials.textContent = (parts.length >= 2
                    ? parts[0][0] + parts[parts.length - 1][0]
                    : source.slice(0, 2)).toUpperCase();
            }
            adminBadge?.classList.toggle('hidden', !isSysAdmin);
            if (projectsLink) projectsLink.href = `/user/${userId}/`;
            if (settingsLink) settingsLink.href = `/user/${userId}/settings/`;
            projectsLinkMobile?.classList.remove('hidden');
            settingsLinkMobile?.classList.remove('hidden');
            logoutBtnMobile?.classList.remove('hidden');
            if (projectsLinkMobile) projectsLinkMobile.href = `/user/${userId}/`;
            if (settingsLinkMobile) settingsLinkMobile.href = `/user/${userId}/settings/`;
            if (isSysAdmin) {
                if (backOfficeLink) {
                    backOfficeLink.href = `/user/${userId}/back-office/`;
                    backOfficeLink.classList.remove('hidden');
                }
                if (backOfficeLinkMobile) {
                    backOfficeLinkMobile.href = `/user/${userId}/back-office/`;
                    backOfficeLinkMobile.classList.remove('hidden');
                }
            } else {
                backOfficeLink?.classList.add('hidden');
                backOfficeLinkMobile?.classList.add('hidden');
            }
        } else {
            loginButton?.classList.remove('hidden');
            loginButtonMobileBtn?.classList.remove('hidden');
            userMenu?.classList.add('hidden');
            projectsLinkMobile?.classList.add('hidden');
            settingsLinkMobile?.classList.add('hidden');
            backOfficeLinkMobile?.classList.add('hidden');
            logoutBtnMobile?.classList.add('hidden');
        }
    }

    function logout() {
        localStorage.removeItem('userEmail');
        localStorage.removeItem('userName');
        localStorage.removeItem('userFullName');
        localStorage.removeItem('userId');
        localStorage.removeItem('isSysAdmin');
        window.location.href = '/';
    }

    updateNavbar();
    document.getElementById('logout-button')?.addEventListener('click', logout);
    document.getElementById('logout-button-mobile')?.addEventListener('click', logout);

    document.getElementById('mobile-menu-button')?.addEventListener('click', function () {
        document.getElementById('mobile-menu').classList.toggle('hidden');
    });

    (function () {
        const button = document.getElementById('user-menu-button');
        const panel = document.getElementById('user-menu-panel');
        if (!button || !panel) return;
        function close() {
            panel.classList.add('hidden');
            button.setAttribute('aria-expanded', 'false');
        }
        button.addEventListener('click', function (e) {
            e.stopPropagation();
            const open = panel.classList.toggle('hidden') === false;
            button.setAttribute('aria-expanded', String(open));
        });
        document.addEventListener('click', function (e) {
            if (!panel.contains(e.target) && e.target !== button) close();
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') close();
        });
    })();

    const modal = document.getElementById('login-modal');
    const loginButton = document.getElementById('login-button');
    const loginButtonMobile = document.getElementById('login-button-mobile');
    const closeModal = document.getElementById('close-modal');
    const loginForm = document.getElementById('login-form');
    const loginMessage = document.getElementById('login-message');

    function openModal() { modal.classList.remove('hidden'); }
    function closeModalFunc() {
        modal.classList.add('hidden');
        loginForm.reset();
        loginMessage.classList.add('hidden');
    }

    loginButton?.addEventListener('click', openModal);
    loginButtonMobile?.addEventListener('click', openModal);
    closeModal?.addEventListener('click', closeModalFunc);
    modal?.addEventListener('click', function (e) {
        if (e.target === modal) closeModalFunc();
    });

    {{- $usersByEmail := dict -}}
    {{- range $userId, $u := .Site.Data.users -}}
        {{- $entry := dict "userName" $userId "fullName" $u.fullName "userId" $userId "isSysAdmin" (or $u.sysadmin false) -}}
        {{- $usersByEmail = merge $usersByEmail (dict $u.email $entry) -}}
    {{- end }}
    const USERS_BY_EMAIL = {{ $usersByEmail | jsonify | safeJS }};
    const SHARED_PASSWORD = 'insilecloud';

    loginForm?.addEventListener('submit', function (e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const user = USERS_BY_EMAIL[email];
        if (user && password === SHARED_PASSWORD) {
            localStorage.setItem('userEmail', email);
            localStorage.setItem('userName', user.userName);
            localStorage.setItem('userFullName', user.fullName);
            localStorage.setItem('userId', user.userId);
            localStorage.setItem('isSysAdmin', user.isSysAdmin ? 'true' : 'false');
            window.location.href = `/user/${user.userId}`;
        } else {
            loginMessage.textContent = 'Invalid credentials. Please try again.';
            loginMessage.className = 'mt-4 p-3 rounded-md text-sm bg-red-50 text-red-700 border border-red-100 dark:bg-red-950/40 dark:text-red-300 dark:border-red-900';
            loginMessage.classList.remove('hidden');
            setTimeout(() => loginMessage.classList.add('hidden'), 3000);
        }
    });
</script>
