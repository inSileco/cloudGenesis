{{ define "title" }}
{{ .Site.Title }}
{{ end }}

{{ define "main" }}
<div class="min-h-screen flex items-center justify-center">
    <div class="text-center">
        <img src="/logo.png" alt="{{ .Site.Title }}" class="h-48 w-auto mx-auto mb-8">
        <h1 class="text-6xl font-bold mb-4">{{ .Site.Title }}</h1>
        <p class="text-xl text-gray-600 dark:text-gray-400">{{ .Site.Params.description }}</p>
    </div>
</div>
{{ end }}
