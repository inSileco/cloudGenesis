{{ define "title" }}
{{ .Title }} | {{ .Site.Title }}
{{ end }}

{{ define "main" }}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-4xl font-bold mb-8">{{ .Title }}</h1>

    <div class="space-y-4">
        {{ range .Pages }}
        <article class="border-b border-gray-200 dark:border-gray-700 pb-4">
            <h2 class="text-2xl font-semibold mb-2">
                <a href="{{ .RelPermalink }}" class="hover:text-blue-600 dark:hover:text-blue-400">
                    {{ .Title }}
                </a>
            </h2>
            <p class="text-gray-600 dark:text-gray-400">{{ .Summary }}</p>
        </article>
        {{ end }}
    </div>
</div>
{{ end }}
