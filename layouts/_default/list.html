{{ define "title" }}{{ .Title }} | {{ .Site.Title }}{{ end }}

{{ define "main" }}
<div class="container mx-auto px-4 py-10 max-w-4xl">
    <div class="kicker mb-2">{{ i18n "kicker_index" }}</div>
    <h1 class="text-4xl mb-3">{{ .Title }}</h1>
    <div class="accent-rule mb-8"></div>

    <div class="space-y-4">
        {{ range .Pages }}
        <article class="surface-card p-6 hover:border-brand-300 dark:hover:border-accent/60 transition-colors">
            <h2 class="text-2xl mb-2">
                <a href="{{ .RelPermalink }}" class="hover:text-brand-500 dark:hover:text-accent">{{ .Title }}</a>
            </h2>
            <p class="text-muted">{{ .Summary }}</p>
        </article>
        {{ end }}
    </div>
</div>
{{ end }}
