<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1750" width="1200" height="1750" font-family="Roboto, sans-serif">
  <defs>
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;800&family=Merriweather:wght@400;700;900&display=swap');
      .h-serif { font-family: 'Merriweather', serif; }
      .h-sans  { font-family: 'Roboto', sans-serif; }
      .kicker  { font-family: 'Roboto', sans-serif; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
    ]]></style>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1d3449"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="rgba(55,171,200,0.65)"/>
      <stop offset="100%" stop-color="rgba(255,224,138,0.85)"/>
    </linearGradient>
    <linearGradient id="callout" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="rgba(55,171,200,0.20)"/>
      <stop offset="100%" stop-color="rgba(255,224,138,0.30)"/>
    </linearGradient>
    <linearGradient id="timeline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="rgba(148,163,184,0.80)"/>
      <stop offset="100%" stop-color="rgba(55,171,200,0.75)"/>
    </linearGradient>
    <linearGradient id="price" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#eff9fc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="workshop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#d9eef4"/>
      <stop offset="45%"  stop-color="#eef7fa"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Page background -->
  <rect width="1200" height="1750" fill="#ffffff"/>

  <!-- ========== HEADER ========== -->
  <rect x="0" y="0" width="1200" height="220" fill="url(#navy)"/>
  <g transform="translate(80,80)">
    <!-- Simplified mark using accent + primary -->
    <circle cx="32" cy="32" r="32" fill="#37abc8"/>
    <circle cx="48" cy="22" r="14" fill="#ffe08a"/>
  </g>
  <text x="180" y="105" class="kicker" fill="#ffe08a" font-size="14">Brand &amp; visual system</text>
  <text x="180" y="155" class="h-serif" fill="#ffffff" font-size="44" font-weight="900">Graphic Charter</text>
  <text x="180" y="190" class="h-sans" fill="rgba(255,255,255,0.78)" font-size="16" font-weight="400">inSileco — extracted from production CSS (main.scss, insileco.css, fonts.css)</text>

  <!-- ========== LOGO &amp; WORDMARK ========== -->
  <g transform="translate(80,270)">
    <text class="kicker" fill="#2f95ae" font-size="13">01 — Logo &amp; wordmark</text>
    <line x1="0" y1="18" x2="1040" y2="18" stroke="#e5e7eb" stroke-width="1"/>
    <!-- Logo box -->
    <rect x="0" y="40" width="320" height="180" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
    <g transform="translate(110,90)">
      <circle cx="40" cy="40" r="40" fill="#37abc8"/>
      <circle cx="62" cy="28" r="18" fill="#ffe08a"/>
    </g>
    <text x="160" y="245" text-anchor="middle" class="kicker" fill="#64748b" font-size="11">Primary</text>

    <!-- Mono dark -->
    <rect x="360" y="40" width="320" height="180" rx="16" fill="url(#navy)"/>
    <g transform="translate(470,90)">
      <circle cx="40" cy="40" r="40" fill="#ffffff"/>
      <circle cx="62" cy="28" r="18" fill="#ffe08a"/>
    </g>
    <text x="520" y="245" text-anchor="middle" class="kicker" fill="#64748b" font-size="11">On dark</text>

    <!-- Wordmark -->
    <rect x="720" y="40" width="320" height="180" rx="16" fill="#f8fafc" stroke="#e5e7eb"/>
    <text x="880" y="135" text-anchor="middle" class="h-serif" fill="#0f172a" font-size="34" font-weight="900">in<tspan fill="#37abc8">Sile</tspan>co</text>
    <text x="880" y="170" text-anchor="middle" class="h-sans" fill="#64748b" font-size="12" font-weight="500" letter-spacing="0.1em">DATA · SCIENCE · DECISION</text>
    <text x="880" y="245" text-anchor="middle" class="kicker" fill="#64748b" font-size="11">Wordmark</text>
  </g>

  <!-- ========== COLOR PALETTE ========== -->
  <g transform="translate(80,580)">
    <text class="kicker" fill="#2f95ae" font-size="13">02 — Core palette</text>
    <line x1="0" y1="18" x2="1040" y2="18" stroke="#e5e7eb" stroke-width="1"/>

    <!-- Hero swatch: Primary -->
    <rect x="0" y="40" width="500" height="240" rx="16" fill="#37abc8"/>
    <text x="30" y="80" class="kicker" fill="rgba(255,255,255,0.75)" font-size="12">Primary</text>
    <text x="30" y="170" class="h-serif" fill="#ffffff" font-size="44" font-weight="900">#37ABC8</text>
    <text x="30" y="205" class="h-sans" fill="rgba(255,255,255,0.85)" font-size="14" font-weight="500">RGB 55 · 171 · 200</text>
    <text x="30" y="255" class="h-sans" fill="rgba(255,255,255,0.78)" font-size="13" font-weight="400" font-style="italic">Links, primary buttons, navbar contact, accent lines</text>

    <!-- Accent: Gold -->
    <rect x="520" y="40" width="240" height="240" rx="16" fill="#ffe08a"/>
    <text x="540" y="80" class="kicker" fill="rgba(15,23,42,0.65)" font-size="12">Accent</text>
    <text x="540" y="160" class="h-serif" fill="#0f172a" font-size="28" font-weight="900">#FFE08A</text>
    <text x="540" y="190" class="h-sans" fill="rgba(15,23,42,0.7)" font-size="13" font-weight="500">RGB 255 · 224 · 138</text>
    <text x="540" y="255" class="h-sans" fill="rgba(15,23,42,0.7)" font-size="12" font-style="italic">Highlights · proof values · checkbox</text>

    <!-- Dark -->
    <rect x="780" y="40" width="260" height="240" rx="16" fill="url(#navy)"/>
    <text x="800" y="80" class="kicker" fill="rgba(255,255,255,0.6)" font-size="12">Dark band</text>
    <text x="800" y="155" class="h-serif" fill="#ffffff" font-size="22" font-weight="900">#0F172A → #1D3449</text>
    <text x="800" y="185" class="h-sans" fill="rgba(255,255,255,0.75)" font-size="12" font-weight="500">Navy linear-gradient 135°</text>
    <text x="800" y="255" class="h-sans" fill="rgba(255,255,255,0.7)" font-size="12" font-style="italic">CTA · proof strip · team card</text>

    <!-- Primary variations strip -->
    <g transform="translate(0,310)">
      <rect x="0"   y="0" width="170" height="80" rx="10" fill="#37abc8"/>
      <rect x="178" y="0" width="170" height="80" rx="10" fill="#2f95ae"/>
      <rect x="356" y="0" width="170" height="80" rx="10" fill="#267f94"/>
      <rect x="534" y="0" width="170" height="80" rx="10" fill="#1f4e5c"/>
      <rect x="712" y="0" width="170" height="80" rx="10" fill="#00b5b5"/>
      <rect x="890" y="0" width="150" height="80" rx="10" fill="#eef5f8" stroke="#e5e7eb"/>

      <text x="14"  y="56" class="h-sans" fill="#ffffff" font-size="13" font-weight="700">#37ABC8</text>
      <text x="192" y="56" class="h-sans" fill="#ffffff" font-size="13" font-weight="700">#2F95AE</text>
      <text x="370" y="56" class="h-sans" fill="#ffffff" font-size="13" font-weight="700">#267F94</text>
      <text x="548" y="56" class="h-sans" fill="#ffffff" font-size="13" font-weight="700">#1F4E5C</text>
      <text x="726" y="56" class="h-sans" fill="#ffffff" font-size="13" font-weight="700">#00B5B5</text>
      <text x="904" y="56" class="h-sans" fill="#1f4e5c" font-size="13" font-weight="700">#EEF5F8</text>

      <text x="14"  y="100" class="kicker" fill="#64748b" font-size="9">Primary</text>
      <text x="192" y="100" class="kicker" fill="#64748b" font-size="9">Hover</text>
      <text x="370" y="100" class="kicker" fill="#64748b" font-size="9">Pressed</text>
      <text x="548" y="100" class="kicker" fill="#64748b" font-size="9">Meta text</text>
      <text x="726" y="100" class="kicker" fill="#64748b" font-size="9">Member ring</text>
      <text x="904" y="100" class="kicker" fill="#64748b" font-size="9">Tint pill</text>
    </g>
  </g>

  <!-- ========== NEUTRAL SCALE ========== -->
  <g transform="translate(80,1020)">
    <text class="kicker" fill="#2f95ae" font-size="13">03 — Neutrals · ink · surface</text>
    <line x1="0" y1="18" x2="1040" y2="18" stroke="#e5e7eb" stroke-width="1"/>

    <!-- Ink scale -->
    <g transform="translate(0,40)">
      <rect x="0"   y="0" width="120" height="120" rx="10" fill="#0f172a"/>
      <rect x="130" y="0" width="120" height="120" rx="10" fill="#1f2937"/>
      <rect x="260" y="0" width="120" height="120" rx="10" fill="#334155"/>
      <rect x="390" y="0" width="120" height="120" rx="10" fill="#475569"/>
      <rect x="520" y="0" width="120" height="120" rx="10" fill="#64748b"/>
      <rect x="650" y="0" width="120" height="120" rx="10" fill="#6b7280"/>
      <rect x="780" y="0" width="120" height="120" rx="10" fill="#73848a"/>
      <rect x="910" y="0" width="120" height="120" rx="10" fill="rgb(48,48,48)"/>

      <text x="12"  y="100" class="h-sans" fill="#ffffff" font-size="12" font-weight="700">#0F172A</text>
      <text x="142" y="100" class="h-sans" fill="#ffffff" font-size="12" font-weight="700">#1F2937</text>
      <text x="272" y="100" class="h-sans" fill="#ffffff" font-size="12" font-weight="700">#334155</text>
      <text x="402" y="100" class="h-sans" fill="#ffffff" font-size="12" font-weight="700">#475569</text>
      <text x="532" y="100" class="h-sans" fill="#ffffff" font-size="12" font-weight="700">#64748B</text>
      <text x="662" y="100" class="h-sans" fill="#ffffff" font-size="12" font-weight="700">#6B7280</text>
      <text x="792" y="100" class="h-sans" fill="#ffffff" font-size="12" font-weight="700">#73848A</text>
      <text x="922" y="100" class="h-sans" fill="#ffffff" font-size="12" font-weight="700">rgb 48</text>

      <text x="12"  y="140" class="kicker" fill="#64748b" font-size="9">Ink near-black</text>
      <text x="142" y="140" class="kicker" fill="#64748b" font-size="9">Slate 800</text>
      <text x="272" y="140" class="kicker" fill="#64748b" font-size="9">Slate 700</text>
      <text x="402" y="140" class="kicker" fill="#64748b" font-size="9">Slate 600</text>
      <text x="532" y="140" class="kicker" fill="#64748b" font-size="9">Slate 500</text>
      <text x="662" y="140" class="kicker" fill="#64748b" font-size="9">Muted gray</text>
      <text x="792" y="140" class="kicker" fill="#64748b" font-size="9">Muted hero</text>
      <text x="922" y="140" class="kicker" fill="#64748b" font-size="9">Body text</text>
    </g>

    <!-- Surface scale -->
    <g transform="translate(0,210)">
      <rect x="0"   y="0" width="120" height="120" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
      <rect x="130" y="0" width="120" height="120" rx="10" fill="#f6f6f6" stroke="#e5e7eb"/>
      <rect x="260" y="0" width="120" height="120" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
      <rect x="390" y="0" width="120" height="120" rx="10" fill="#f3f4f6" stroke="#e5e7eb"/>
      <rect x="520" y="0" width="120" height="120" rx="10" fill="#eef5f8" stroke="#e5e7eb"/>
      <rect x="650" y="0" width="120" height="120" rx="10" fill="#d9eef4" stroke="#e5e7eb"/>
      <rect x="780" y="0" width="120" height="120" rx="10" fill="#e5e7eb"/>
      <rect x="910" y="0" width="120" height="120" rx="10" fill="#cbd5f5"/>

      <text x="12"  y="100" class="h-sans" fill="#0f172a" font-size="12" font-weight="700">#FFFFFF</text>
      <text x="142" y="100" class="h-sans" fill="#0f172a" font-size="12" font-weight="700">#F6F6F6</text>
      <text x="272" y="100" class="h-sans" fill="#0f172a" font-size="12" font-weight="700">#F8FAFC</text>
      <text x="402" y="100" class="h-sans" fill="#0f172a" font-size="12" font-weight="700">#F3F4F6</text>
      <text x="532" y="100" class="h-sans" fill="#0f172a" font-size="12" font-weight="700">#EEF5F8</text>
      <text x="662" y="100" class="h-sans" fill="#0f172a" font-size="12" font-weight="700">#D9EEF4</text>
      <text x="792" y="100" class="h-sans" fill="#0f172a" font-size="12" font-weight="700">#E5E7EB</text>
      <text x="922" y="100" class="h-sans" fill="#0f172a" font-size="12" font-weight="700">#CBD5F5</text>

      <text x="12"  y="140" class="kicker" fill="#64748b" font-size="9">Page</text>
      <text x="142" y="140" class="kicker" fill="#64748b" font-size="9">Soft band</text>
      <text x="272" y="140" class="kicker" fill="#64748b" font-size="9">Slate band</text>
      <text x="402" y="140" class="kicker" fill="#64748b" font-size="9">Gray field</text>
      <text x="532" y="140" class="kicker" fill="#64748b" font-size="9">Tint pill</text>
      <text x="662" y="140" class="kicker" fill="#64748b" font-size="9">Aqua hero</text>
      <text x="792" y="140" class="kicker" fill="#64748b" font-size="9">Border</text>
      <text x="922" y="140" class="kicker" fill="#64748b" font-size="9">Hover border</text>
    </g>
  </g>

  <!-- ========== WORKSHOP THEME PALETTES ========== -->
  <g transform="translate(80,1410)">
    <text class="kicker" fill="#2f95ae" font-size="13">04 — Workshop theme palettes</text>
    <line x1="0" y1="18" x2="1040" y2="18" stroke="#e5e7eb" stroke-width="1"/>

    <!-- Data management -->
    <g transform="translate(0,40)">
      <rect x="0" y="0" width="250" height="110" rx="12" fill="rgb(227,244,230)" fill-opacity="0.92" stroke="#e5e7eb"/>
      <text x="20" y="35" class="kicker" fill="#245b2f" font-size="11">Data management</text>
      <text x="20" y="70" class="h-serif" fill="#245b2f" font-size="20" font-weight="900">#245B2F</text>
      <text x="20" y="92" class="h-sans" fill="#245b2f" font-size="11" font-weight="500">on rgba(227,244,230,.92)</text>
    </g>

    <!-- Analytical -->
    <g transform="translate(265,40)">
      <rect x="0" y="0" width="250" height="110" rx="12" fill="rgb(221,240,246)" fill-opacity="0.94" stroke="#e5e7eb"/>
      <text x="20" y="35" class="kicker" fill="#1f5b6c" font-size="11">Analytical capabilities</text>
      <text x="20" y="70" class="h-serif" fill="#1f5b6c" font-size="20" font-weight="900">#1F5B6C</text>
      <text x="20" y="92" class="h-sans" fill="#1f5b6c" font-size="11" font-weight="500">on rgba(221,240,246,.94)</text>
    </g>

    <!-- Decision support -->
    <g transform="translate(530,40)">
      <rect x="0" y="0" width="250" height="110" rx="12" fill="rgb(255,240,199)" fill-opacity="0.94" stroke="#e5e7eb"/>
      <text x="20" y="35" class="kicker" fill="#7a4d0b" font-size="11">Decision support</text>
      <text x="20" y="70" class="h-serif" fill="#7a4d0b" font-size="20" font-weight="900">#7A4D0B</text>
      <text x="20" y="92" class="h-sans" fill="#7a4d0b" font-size="11" font-weight="500">on rgba(255,240,199,.94)</text>
    </g>

    <!-- Automated workflows -->
    <g transform="translate(795,40)">
      <rect x="0" y="0" width="245" height="110" rx="12" fill="rgb(231,228,247)" fill-opacity="0.94" stroke="#e5e7eb"/>
      <text x="20" y="35" class="kicker" fill="#4f3f7f" font-size="11">Automated workflows</text>
      <text x="20" y="70" class="h-serif" fill="#4f3f7f" font-size="20" font-weight="900">#4F3F7F</text>
      <text x="20" y="92" class="h-sans" fill="#4f3f7f" font-size="11" font-weight="500">on rgba(231,228,247,.94)</text>
    </g>
  </g>

  <!-- ========== TYPOGRAPHY ========== -->
  <g transform="translate(80,1610)">
    <text class="kicker" fill="#2f95ae" font-size="13">05 — Typography</text>
    <line x1="0" y1="18" x2="1040" y2="18" stroke="#e5e7eb" stroke-width="1"/>
  </g>

  <!-- Serif sample -->
  <g transform="translate(80,1660)">
    <rect x="0" y="0" width="620" height="70" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="20" y="34" class="kicker" fill="#64748b" font-size="11">Headings — Merriweather Black 900</text>
    <text x="20" y="62" class="h-serif" fill="#0f172a" font-size="22" font-weight="900">Data science for evidence-based decisions</text>
  </g>

  <g transform="translate(720,1660)">
    <rect x="0" y="0" width="400" height="70" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="20" y="34" class="kicker" fill="#64748b" font-size="11">Body — Roboto 400/500</text>
    <text x="20" y="58" class="h-sans" fill="rgb(48,48,48)" font-size="13" font-weight="400">From ecology to operations — reproducible.</text>
  </g>
</svg>
