automations:
  - id: "biodiversity-etl"
    name: "Biodiversity ETL"
    description: "Ingests raw census CSVs, resolves taxa against GBIF, computes Shannon and Simpson diversity indices, and writes parquet outputs back to the project dataset store."
    schedule: "Weekly · Sunday 02:00 UTC"
    avg_duration: "10m 32s"
    runs_count: 47
    steps:
      - name: "Extract"
        description: "Pull CSV exports from the field-collector bucket"
        avg_duration: "1m 12s"
      - name: "Validate"
        description: "Schema check + GBIF taxon resolution"
        avg_duration: "3m 04s"
      - name: "Transform"
        description: "Compute diversity indices and plot-level aggregations"
        avg_duration: "5m 22s"
      - name: "Load"
        description: "Write parquet to project dataset store"
        avg_duration: "0m 48s"
