name: "Climate Watch Atlantic"
short_description: "Atlantic climate and ocean monitoring"
description: "Integrated climate modelling and ocean monitoring across the Atlantic basin, combining satellite, in-situ and reanalysis data to track temperature, currents and weather trends."
created: "2024-02-19"
location: "North Atlantic basin"
members:
  - sd
datasets:
  - name: "Climate Model Outputs"
    format: "netcdf"
    volume: "8.5 GB"
    link: "climate-watch/climate_models.nc"
  - name: "Weather Station Data"
    format: "csv"
    volume: "650 MB"
    link: "climate-watch/weather_stations.csv"
  - name: "Satellite Imagery Archive"
    format: "tiff"
    volume: "15 GB"
    link: "climate-watch/satellite_archive.tiff"
  - name: "Ocean Temperature Readings"
    format: "csv"
    volume: "220 MB"
    link: "climate-watch/ocean_temp.csv"
reports:
