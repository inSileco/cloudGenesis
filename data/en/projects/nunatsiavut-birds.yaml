  - id: "habitat-sdm"
    name: "Habitat Suitability Model"
    description: "Runs the ensemble species-distribution model across the habitat rasters, producing suitability layers per species and climate scenario."
    schedule: "Monthly · 1st of month, 03:00 UTC"
    inputs:
      - name: "Habitat rasters"
        type: "Raster"
        description: "Environmental predictor layers for the study area"
      - name: "Occurrence records"
        type: "Dataset"
        description: "Species presence points used to fit the models"
    outputs:
      - name: "Suitability layers"
        type: "Raster"
        description: "Per-species suitability rasters for three climate scenarios"
    avg_duration: "42m 11s"
    runs_count: 9
    steps:
      - name: "Prepare predictors"
        description: "Resample and align habitat rasters"
        avg_duration: "6m 14s"
      - name: "Fit ensemble"
        description: "Random forest + GBM + MaxEnt models"
        avg_duration: "28m 02s"
      - name: "Project"
        description: "Project under three climate scenarios"
        avg_duration: "6m 45s"
      - name: "Publish"
        description: "Write per-species suitability rasters"
        avg_duration: "1m 10s"
