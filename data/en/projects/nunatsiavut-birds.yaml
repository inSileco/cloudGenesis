automations:
  - id: "telemetry-ingest"
    name: "Telemetry Ingest"
    description: "Pulls the latest GPS fixes from satellite collar providers, deduplicates and writes nightly track segments to the project store."
    schedule: "Daily · 04:30 UTC"
    inputs:
      - name: "Argos & Movebank fixes"
        type: "API"
        description: "Latest GPS fixes from satellite collar providers"
    outputs:
      - name: "Telemetry Tracks"
        type: "GeoJSON"
        description: "Nightly per-individual track segments appended to the dataset"
    avg_duration: "6m 41s"
    runs_count: 198
    steps:
      - name: "Fetch"
        description: "Pull fixes from Argos and Movebank APIs"
        avg_duration: "2m 11s"
      - name: "Deduplicate"
        description: "Drop duplicate fixes and filter implausible speeds"
        avg_duration: "1m 38s"
      - name: "Segment"
        description: "Build per-individual track segments"
        avg_duration: "2m 04s"
      - name: "Load"
        description: "Append GeoJSON to the Telemetry Tracks dataset"
        avg_duration: "0m 48s"
    last_execution:
      date: "2026-05-22 04:33 UTC"
      status: "success"
      duration: "6m 52s"
      records_processed: 12480
    recent_runs:
