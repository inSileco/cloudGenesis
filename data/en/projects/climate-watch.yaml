automations:
  - id: "satellite-ingest"
    name: "Satellite Ingest"
    description: "Polls the satellite provider for new scenes, downloads matching tiles and stages them for the imagery archive."
    schedule: "Every 6h"
    inputs:
      - name: "Provider scene catalogue"
        type: "API"
        description: "New scenes matching the basin area of interest"
    outputs:
      - name: "Satellite Imagery Archive"
        type: "GeoTIFF"
        description: "Staged tiles written to the imagery archive bucket"
    avg_duration: "18m 04s"
    runs_count: 612
    steps:
      - name: "Poll catalogue"
        description: "List new scenes matching the basin AOI"
        avg_duration: "0m 41s"
      - name: "Download"
        description: "Fetch tiles from provider"
        avg_duration: "14m 52s"
      - name: "Stage"
        description: "Write to the imagery archive bucket"
        avg_duration: "2m 31s"
    last_execution:
      date: "2026-05-22 12:00 UTC"
      status: "success"
      duration: "17m 41s"
      records_processed: 142
