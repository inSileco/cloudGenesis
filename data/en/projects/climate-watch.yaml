name: "Climate Watch Atlantic"
short_description: "Atlantic climate and ocean monitoring"
description: "Integrated climate modelling and ocean monitoring across the Atlantic basin, combining satellite, in-situ and reanalysis data to track temperature, currents and weather trends."
