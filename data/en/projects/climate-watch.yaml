datasets:
  - id: "climate-model-outputs"
    name: "Climate Model Outputs"
    description: "Downscaled CMIP6 outputs for the Atlantic basin under SSP2-4.5, SSP3-7.0 and SSP5-8.5 scenarios."
    format: "netcdf"
    volume: "8.5 GB"
    record_count: 1
    last_updated: "2026-03-18"
    source: "CMIP6 ensemble (downscaled)"
    status: "active"
    link: "climate-watch/climate_models.nc"
  - id: "weather-station-data"
    name: "Weather Station Data"
    description: "Hourly readings from the basin weather-station network. Raw data; QC flags live in a separate column emitted by the QC automation."
    format: "csv"
    volume: "650 MB"
    record_count: 4128000
    last_updated: "2026-05-22"
    source: "Environment Canada + Met Office"
    status: "active"
    link: "climate-watch/weather_stations.csv"
    schema:
      - name: "station_id"
        type: "string"
        description: "Station identifier"
      - name: "observed_at"
        type: "timestamp"
        description: "Local observation time"
      - name: "temp_c"
        type: "float"
        description: "Air temperature (°C)"
      - name: "wind_speed"
        type: "float"
        description: "Wind speed (m/s)"
      - name: "qc_flag"
        type: "string"
        description: "QC outcome (ok, suspect, fail)"
  - id: "satellite-imagery-archive"
    name: "Satellite Imagery Archive"
    description: "Mosaic of Sentinel-2 L2A tiles for the basin, refreshed by the satellite-ingest automation."
    format: "tiff"
    volume: "15 GB"
    record_count: 1842
    last_updated: "2026-05-22"
    source: "Copernicus Sentinel-2"
    status: "active"
    link: "climate-watch/satellite_archive.tiff"
  - id: "ocean-temperature-readings"
    name: "Ocean Temperature Readings"
    description: "Subsurface temperature profiles from Argo floats and moored buoys across the basin."
    format: "csv"
    volume: "220 MB"
    record_count: 1284000
    last_updated: "2026-05-20"
    source: "Argo programme + DFO moorings"
    status: "active"
    link: "climate-watch/ocean_temp.csv"
    schema:
      - name: "platform_id"
        type: "string"
        description: "Float or buoy identifier"
      - name: "observed_at"
        type: "timestamp"
        description: "Observation time (UTC)"
      - name: "depth_m"
        type: "float"
        description: "Sampling depth (m)"
      - name: "temp_c"
        type: "float"
        description: "Sea temperature (°C)"
