name: "Candiac Microforest"
short_description: "Ecological monitoring of a Miyawaki-style microforest"
description: "Multi-year monitoring of a community microforest in Candiac, Québec. The project documents biodiversity, soil health, canopy growth and ecosystem services through field surveys, LiDAR and citizen-science contributions."
created: "2024-05-12"
location: "Candiac, Québec"
last_activity: "4 hours ago"
owner: kc
admins:
  - mhb
members:
  - kc
  - mhb
plan: "Research"
quotas:
  storage_gb: 100
  compute_hours: 80
  seats: 2
billing:
  next_invoice: "2026-06-01"
usage:
  storage_gb: 24.5
  compute_hours_month: 18.5
  monthly_cost: 42
datasets:
  - id: "biodiversity-census-2024"
    name: "Biodiversity Census 2024"
    description: "Full 2024 biodiversity census of the Candiac microforest. Plot-level observations resolved against GBIF, with diversity indices precomputed."
    format: "parquet"
    volume: "3.2 GB"
    record_count: 84231
    last_updated: "2025-10-08"
    source: "Field-collector tablets + iNaturalist exports"
    status: "active"
    link: "candiac-microforest/biodiversity2024.parquet"
    schema:
      - name: "plot_id"
        type: "string"
        description: "Permanent plot identifier"
      - name: "observation_date"
        type: "date"
        description: "Date of the field observation"
      - name: "taxon_id"
        type: "string"
        description: "GBIF taxon key"
      - name: "abundance"
        type: "integer"
        description: "Counted individuals"
      - name: "observer"
        type: "string"
        description: "Field observer initials"
  - id: "species-distribution-maps"
    name: "Species Distribution Maps"
    description: "Per-species presence polygons for the microforest perimeter, derived from the 2024 census and historical records."
    format: "geojson"
    volume: "850 MB"
    record_count: 1842
    last_updated: "2025-09-22"
    source: "Derived from Biodiversity Census 2024"
    status: "active"
    link: "candiac-microforest/species_maps.geojson"
    schema:
      - name: "species"
        type: "string"
        description: "Scientific name"
      - name: "geometry"
        type: "geojson"
        description: "Presence polygon"
      - name: "confidence"
        type: "float"
        description: "Model confidence 0–1"
  - id: "ecological-survey-data"
    name: "Ecological Survey Data"
    description: "Raw field survey notebooks covering plot setup, soil, light and canopy measurements across the 2023–2025 seasons."
    format: "csv"
    volume: "120 MB"
    record_count: 31420
    last_updated: "2025-08-30"
    source: "Field crew, Brice lab"
    status: "active"
    link: "candiac-microforest/ecological_survey.csv"
    schema:
      - name: "plot_id"
        type: "string"
        description: "Permanent plot identifier"
      - name: "measurement"
        type: "string"
        description: "Measurement type (soil_pH, canopy_cover, …)"
      - name: "value"
        type: "float"
        description: "Numeric reading"
      - name: "measured_at"
        type: "timestamp"
        description: "Local timestamp of reading"
  - id: "canopy-lidar"
    name: "Microforest canopy LiDAR"
    description: "Aerial LiDAR scan of the microforest canopy. Useful for canopy height models and biomass estimates."
    format: "las"
    volume: "1.4 GB"
    record_count: 12400000
    last_updated: "2024-11-04"
    source: "Drone survey by Brice lab"
    status: "active"
    link: "candiac-microforest/canopy_lidar.las"
  - id: "soil-moisture-timeseries"
    name: "Soil moisture timeseries"
    description: "Half-hourly soil moisture readings from the field sensor network."
    format: "csv"
    volume: "42 MB"
    record_count: 612400
    last_updated: "2026-05-24"
    source: "In-situ sensor array (12 nodes)"
    status: "active"
    link: "candiac-microforest/soil_moisture.csv"
    schema:
      - name: "node_id"
        type: "string"
        description: "Sensor node identifier"
      - name: "measured_at"
        type: "timestamp"
        description: "Reading timestamp (UTC)"
      - name: "vwc"
        type: "float"
        description: "Volumetric water content (m³/m³)"
      - name: "temp_c"
        type: "float"
        description: "Soil temperature (°C)"
