    schedule: "Hebdomadaire · dimanche 02:00 UTC"
    avg_duration: "10m 32s"
    runs_count: 47
    steps:
      - name: "Extraction"
        description: "Récupérer les exportations CSV du compartiment de collecte sur le terrain"
        avg_duration: "1m 12s"
      - name: "Validation"
        description: "Vérification du schéma + résolution des taxons GBIF"
        avg_duration: "3m 04s"
      - name: "Transformation"
        description: "Calculer les indices de diversité et les agrégations par parcelle"
        avg_duration: "5m 22s"
      - name: "Chargement"
        description: "Écrire le parquet dans le dépôt de jeux de données du projet"
